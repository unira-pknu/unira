name: Crawl departments

# 학과 홈페이지(ce 제외 약 100개)를 하루에 1/3씩 돌아가며 증분 크롤링하고,
# 학과 하나씩 크롤링 -> 전처리 -> 벡터화 -> Supabase 적재 -> 우선순위 재계산을 끝낸다(3일에 한 바퀴).
# 끝난 학과의 수집 기록(state.json)은 작업이 시간 제한에 끊겨도 저장해서, 다음 차례엔 새 글만 본다.
# 학과 사이트는 전부 학교 서버 한 대라, 사람이 적은 03:00 KST에 한 묶음씩만 천천히 본다:
# 요청마다 0.8초(학과 설정), 학과 사이 5초를 쉬고, 연속 3개 학과가 실패하면
# 서버가 막기 시작한 것으로 보고 그날은 멈춘다.
# ce·학교 공지·학생생활·학칙은 "Crawl update"가 매일 따로 돈다.
#
# 필요한 저장소 시크릿: DATABASE_URL (Supabase Postgres 연결 문자열)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "몇 번째 묶음을 돌릴지 0, 1, 2 (비우면 날짜로 정함)"
        required: false
        default: ""
      recent_pages:
        description: "게시판별 최근 몇 페이지를 볼지"
        required: false
        default: "2"

permissions:
  contents: write

# Same group as "Crawl update" so the two never load the database at once.
concurrency:
  group: crawl-update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # GitHub caps a job at 6 hours. The first turn of each slice reads every recent
    # post (no saved state yet); later turns only read new ones.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Korean OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Pick today's department slice
        id: shard
        run: |
          shard="${{ inputs.shard }}"
          if [ -z "$shard" ]; then shard=$(( 10#$(date -u +%j) % 3 )); fi
          echo "value=$shard" >> "$GITHUB_OUTPUT"
          echo "department slice: $shard/3"

      - name: Crawl + preprocess + vectorize + load (one department at a time)
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python scripts/vectorization/preprocessing_pipeline_recent.py
          --department-shard "${{ steps.shard.outputs.value }}/3"
          --recent-pages "${{ inputs.recent_pages || '2' }}"
          --time-budget-minutes 300
          --completed-file "$RUNNER_TEMP/completed-departments.txt"

      - name: Commit crawl state of the departments that finished
        # Runs even when the step above failed or ran out of time. Only departments
        # that were crawled AND loaded are listed, so no post is skipped for good;
        # an unfinished one re-reads the same recent pages next turn (loads are upserts).
        if: always()
        run: |
          done_file="$RUNNER_TEMP/completed-departments.txt"
          [ -s "$done_file" ] || { echo "no department finished"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          while IFS= read -r name; do
            find files/department -path "*/$name/state.json" | while IFS= read -r state_path; do
              git add -f -- "$state_path"
            done
          done < "$done_file"
          git diff --cached --quiet && exit 0
          git commit -m "chore(crawler): update department crawl state [skip ci]"
          # A PR may have been merged during the run.
          git pull --rebase
          git push
